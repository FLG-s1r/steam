<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            overflow: hidden;
        }

        /* Анимированный фон */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle, #3b82f6 0%, transparent 20%),
                radial-gradient(circle, #9333ea 0%, transparent 20%),
                radial-gradient(circle, #06b6d4 0%, transparent 20%);
            background-position:
                20% 30%,
                80% 40%,
                50% 80%;
            background-repeat: no-repeat;
            animation: bgMove 12s linear infinite;
            opacity: 0.4;
        }

        @keyframes bgMove {
            0% {
                transform: rotate(0deg) scale(1);
            }

            50% {
                transform: rotate(180deg) scale(1.2);
            }

            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        /* Карточка профиля */
        .card {
            position: relative;
            width: 350px;
            padding: 40px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            color: white;
            z-index: 1;
            animation: fadeUp 1.2s ease;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Аватар */
        .avatar {
            width: 130px;
            height: 130px;
            margin: auto;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #3b82f6;
            animation: pulse 3s infinite;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 10px #3b82f6;
            }

            50% {
                box-shadow: 0 0 30px #9333ea;
            }

            100% {
                box-shadow: 0 0 10px #3b82f6;
            }
        }

        h1 {
            margin-top: 20px;
            font-size: 28px;
        }

        p {
            margin-top: 10px;
            color: #cbd5e1;
            line-height: 1.5;
        }

        /* Кнопки */
        .buttons {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            padding: 12px 22px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
            color: white;
            background: linear-gradient(45deg, #3b82f6, #9333ea);
        }

        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 20px rgba(147, 51, 234, 0.6);
        }

        /* Плавающие частицы */
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: float 10s linear infinite;
        }

        @keyframes float {
            from {
                transform: translateY(100vh) scale(0);
            }

            to {
                transform: translateY(-100vh) scale(1);
            }
        }
    </style>
</head>

<body>

    <!-- Частицы -->
    <div class="particle" style="left:10%; animation-duration:8s;"></div>
    <div class="particle" style="left:30%; animation-duration:12s;"></div>
    <div class="particle" style="left:50%; animation-duration:10s;"></div>
    <div class="particle" style="left:70%; animation-duration:14s;"></div>
    <div class="particle" style="left:90%; animation-duration:9s;"></div>

    <!-- Карточка -->
    <div class="card">

        <div class="avatar">
            <img src="https://i.imgur.com/2DhmtJ4.jpg" alt="avatar">
        </div>

        <h1>John Davis</h1>

        <p>
            Frontend Developer<br>
            UI/UX Designer<br>
            Motion Animation
        </p>

        <div class="buttons">
            <button class="btn">Portfolio</button>
            <button class="btn">Contact</button>
        </div>

    </div>

</body>

</html>
