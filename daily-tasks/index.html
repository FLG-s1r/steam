<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ежедневные задачи</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f172a;
      --surface: rgba(255,255,255,0.06);
      --surface-hover: rgba(255,255,255,0.10);
      --border: rgba(255,255,255,0.12);
      --accent: #6366f1;
      --accent2: #8b5cf6;
      --accent3: #06b6d4;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --done-color: #10b981;
      --danger: #ef4444;
      --radius: 16px;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
      overflow-x: hidden;
    }

    /* Animated background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #6366f1, #8b5cf6);
      top: -100px; left: -100px;
      animation: blobA 14s ease-in-out infinite alternate;
    }
    body::after {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #06b6d4, #3b82f6);
      bottom: -80px; right: -80px;
      animation: blobB 18s ease-in-out infinite alternate;
    }
    @keyframes blobA { to { transform: translate(80px, 60px) scale(1.15); } }
    @keyframes blobB { to { transform: translate(-60px, -40px) scale(1.1); } }

    .app { position: relative; z-index: 1; width: 100%; max-width: 920px; }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 32px;
      animation: fadeUp .6s ease both;
    }
    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc, #818cf8, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

    /* ── Layout grid ── */
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 680px) {
      .layout { grid-template-columns: 1fr; }
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 20px;
      animation: fadeUp .7s ease both;
    }
    .card:nth-child(2) { animation-delay: .1s; }

    /* ── Calendar ── */
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .cal-nav button {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      width: 34px; height: 34px;
      cursor: pointer;
      font-size: 1rem;
      transition: background .2s, transform .15s;
    }
    .cal-nav button:hover { background: rgba(255,255,255,.15); transform: scale(1.1); }
    .cal-month {
      font-weight: 600;
      font-size: 1rem;
      text-transform: capitalize;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .cal-day-name {
      text-align: center;
      font-size: .72rem;
      color: var(--muted);
      padding: 4px 0 8px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .cal-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: .85rem;
      cursor: pointer;
      position: relative;
      transition: background .2s, transform .15s;
      user-select: none;
    }
    .cal-day:hover { background: var(--surface-hover); transform: scale(1.08); }
    .cal-day.empty { cursor: default; pointer-events: none; }
    .cal-day.today { color: var(--accent3); font-weight: 700; }
    .cal-day.selected {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(99,102,241,.45);
      transform: scale(1.08);
    }
    .cal-day.has-tasks::after {
      content: '';
      position: absolute;
      bottom: 4px;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent3);
    }
    .cal-day.selected.has-tasks::after { background: rgba(255,255,255,.7); }

    /* Quick date buttons */
    .quick-dates {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .quick-btn {
      flex: 1;
      min-width: 70px;
      padding: 8px 10px;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      font-size: .8rem;
      cursor: pointer;
      transition: all .2s;
      text-align: center;
    }
    .quick-btn:hover {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(99,102,241,.4);
    }

    /* ── Task panel ── */
    .task-panel { display: flex; flex-direction: column; gap: 16px; }

    .task-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .task-date-label {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
    }
    .task-count {
      font-size: .8rem;
      color: var(--muted);
      background: var(--surface-hover);
      border-radius: 20px;
      padding: 3px 10px;
    }

    /* Add task form */
    .add-form {
      display: flex;
      gap: 8px;
    }
    .add-form input {
      flex: 1;
      background: rgba(255,255,255,.07);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: .95rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .add-form input::placeholder { color: var(--muted); }
    .add-form input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99,102,241,.2);
    }
    .add-form button {
      padding: 12px 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform .15s, box-shadow .2s;
      flex-shrink: 0;
    }
    .add-form button:hover {
      transform: scale(1.08);
      box-shadow: 0 4px 16px rgba(99,102,241,.5);
    }

    /* Filter tabs */
    .filters {
      display: flex;
      gap: 6px;
    }
    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: .8rem;
      cursor: pointer;
      transition: all .2s;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color: transparent;
      color: #fff;
    }
    .filter-btn:hover:not(.active) { background: var(--surface-hover); color: var(--text); }

    /* Task list */
    .task-list { display: flex; flex-direction: column; gap: 8px; min-height: 80px; }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      animation: slideIn .25s ease both;
      transition: opacity .2s, transform .2s;
    }
    .task-item.done { opacity: .55; }
    .task-item.removing { opacity: 0; transform: translateX(30px); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-16px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .task-check {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color .2s, background .2s;
      font-size: .7rem;
    }
    .task-check:hover { border-color: var(--done-color); }
    .task-item.done .task-check {
      background: var(--done-color);
      border-color: var(--done-color);
      color: #fff;
    }

    .task-text {
      flex: 1;
      font-size: .95rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .task-item.done .task-text { text-decoration: line-through; color: var(--muted); }

    .task-time {
      font-size: .72rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .task-del {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 4px;
      border-radius: 6px;
      transition: color .2s, background .2s;
      flex-shrink: 0;
      line-height: 1;
    }
    .task-del:hover { color: var(--danger); background: rgba(239,68,68,.12); }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 32px 0;
      font-size: .9rem;
    }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; opacity: .5; }

    /* Progress bar */
    .progress-wrap { margin-top: 4px; }
    .progress-label {
      font-size: .75rem;
      color: var(--muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .progress-bar {
      height: 5px;
      background: rgba(255,255,255,.08);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--done-color));
      transition: width .4s cubic-bezier(.4,0,.2,1);
    }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div class="app">

  <header>
    <h1>📋 Ежедневные задачи</h1>
    <p>Планируй день — достигай большего</p>
  </header>

  <div class="layout">

    <!-- Calendar -->
    <div class="card" id="calCard">
      <div class="cal-nav">
        <button id="prevMonth">&#8249;</button>
        <span class="cal-month" id="calMonthLabel"></span>
        <button id="nextMonth">&#8250;</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>

      <div class="quick-dates">
        <button class="quick-btn" id="btnToday">Сегодня</button>
        <button class="quick-btn" id="btnTomorrow">Завтра</button>
        <button class="quick-btn" id="btnAfter">Послезавтра</button>
      </div>
    </div>

    <!-- Tasks -->
    <div class="card task-panel">
      <div class="task-header">
        <span class="task-date-label" id="taskDateLabel">—</span>
        <span class="task-count" id="taskCount">0 задач</span>
      </div>

      <div class="progress-wrap" id="progressWrap" style="display:none">
        <div class="progress-label">
          <span>Прогресс</span>
          <span id="progressText">0 / 0</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>

      <div class="add-form">
        <input type="text" id="taskInput" placeholder="Добавить задачу…" maxlength="200" />
        <button id="addBtn" title="Добавить">＋</button>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="active">Активные</button>
        <button class="filter-btn" data-filter="done">Выполненные</button>
      </div>

      <div class="task-list" id="taskList"></div>
    </div>

  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  const STORAGE_KEY = 'daily_tasks_v1';
  let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  // data structure: { "YYYY-MM-DD": [ {id, text, done, createdAt} ] }

  let viewYear, viewMonth;   // calendar view
  let selectedDate = null;   // "YYYY-MM-DD"
  let activeFilter = 'all';

  // ── Helpers ────────────────────────────────────────────────────────────────
  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

  function toKey(y, m, d) {
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  function todayKey() {
    const n = new Date();
    return toKey(n.getFullYear(), n.getMonth(), n.getDate());
  }

  function shiftDay(offset) {
    const d = new Date();
    d.setDate(d.getDate() + offset);
    return toKey(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function formatLabel(key) {
    const [y, m, d] = key.split('-').map(Number);
    const date = new Date(y, m-1, d);
    const today = todayKey();
    const tomorrow = shiftDay(1);
    const after = shiftDay(2);
    const opts = { weekday:'long', day:'numeric', month:'long' };
    const base = date.toLocaleDateString('ru-RU', opts);
    if (key === today) return `Сегодня — ${base}`;
    if (key === tomorrow) return `Завтра — ${base}`;
    if (key === after) return `Послезавтра — ${base}`;
    return base.charAt(0).toUpperCase() + base.slice(1);
  }

  function tasksFor(key) { return data[key] || []; }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

  // ── Calendar ───────────────────────────────────────────────────────────────
  const calGrid = document.getElementById('calGrid');
  const calMonthLabel = document.getElementById('calMonthLabel');

  function initView() {
    const n = new Date();
    viewYear = n.getFullYear();
    viewMonth = n.getMonth();
    selectedDate = todayKey();
  }

  function renderCalendar() {
    const today = todayKey();
    const firstDay = new Date(viewYear, viewMonth, 1);
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    // Monday-first: 0=Mon…6=Sun
    let startDow = firstDay.getDay(); // 0=Sun
    startDow = (startDow + 6) % 7;   // shift to Mon-first

    const monthName = firstDay.toLocaleDateString('ru-RU', { month:'long', year:'numeric' });
    calMonthLabel.textContent = monthName.charAt(0).toUpperCase() + monthName.slice(1);

    const dayNames = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
    let html = dayNames.map(n => `<div class="cal-day-name">${n}</div>`).join('');

    // empty cells
    for (let i = 0; i < startDow; i++) html += `<div class="cal-day empty"></div>`;

    for (let d = 1; d <= daysInMonth; d++) {
      const key = toKey(viewYear, viewMonth, d);
      const classes = ['cal-day'];
      if (key === today) classes.push('today');
      if (key === selectedDate) classes.push('selected');
      if (tasksFor(key).length > 0) classes.push('has-tasks');
      html += `<div class="${classes.join(' ')}" data-key="${key}">${d}</div>`;
    }

    calGrid.innerHTML = html;
    calGrid.querySelectorAll('.cal-day:not(.empty)').forEach(el => {
      el.addEventListener('click', () => selectDate(el.dataset.key));
    });
  }

  function selectDate(key) {
    selectedDate = key;
    // Sync calendar view if needed
    const [y, m] = key.split('-').map(Number);
    viewYear = y; viewMonth = m - 1;
    renderCalendar();
    renderTasks();
  }

  document.getElementById('prevMonth').addEventListener('click', () => {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderCalendar();
  });

  document.getElementById('btnToday').addEventListener('click', () => selectDate(todayKey()));
  document.getElementById('btnTomorrow').addEventListener('click', () => selectDate(shiftDay(1)));
  document.getElementById('btnAfter').addEventListener('click', () => selectDate(shiftDay(2)));

  // ── Tasks ──────────────────────────────────────────────────────────────────
  const taskList = document.getElementById('taskList');
  const taskDateLabel = document.getElementById('taskDateLabel');
  const taskCount = document.getElementById('taskCount');
  const taskInput = document.getElementById('taskInput');
  const progressWrap = document.getElementById('progressWrap');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');

  function renderTasks() {
    if (!selectedDate) { taskList.innerHTML = ''; return; }
    taskDateLabel.textContent = formatLabel(selectedDate);

    const all = tasksFor(selectedDate);
    const done = all.filter(t => t.done).length;
    const total = all.length;

    // Count label
    const active = all.filter(t => !t.done).length;
    taskCount.textContent = total === 0 ? 'Нет задач'
      : `${active} активн. / ${total} всего`;

    // Progress
    if (total > 0) {
      progressWrap.style.display = '';
      const pct = Math.round(done / total * 100);
      progressFill.style.width = pct + '%';
      progressText.textContent = `${done} / ${total}`;
    } else {
      progressWrap.style.display = 'none';
    }

    // Filter
    let items = all;
    if (activeFilter === 'active') items = all.filter(t => !t.done);
    if (activeFilter === 'done') items = all.filter(t => t.done);

    if (items.length === 0) {
      taskList.innerHTML = `
        <div class="empty-state">
          <div class="icon">${total === 0 ? '🗒️' : '✅'}</div>
          ${total === 0
            ? 'Нет задач на этот день.<br>Добавьте первую!'
            : activeFilter === 'active' ? 'Все задачи выполнены!' : 'Нет выполненных задач.'}
        </div>`;
      return;
    }

    taskList.innerHTML = items.map(t => {
      const time = new Date(t.createdAt).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
      return `
        <div class="task-item${t.done ? ' done' : ''}" data-id="${t.id}">
          <div class="task-check" data-toggle="${t.id}">${t.done ? '✓' : ''}</div>
          <span class="task-text">${escHtml(t.text)}</span>
          <span class="task-time">${time}</span>
          <button class="task-del" data-del="${t.id}" title="Удалить">✕</button>
        </div>`;
    }).join('');

    taskList.querySelectorAll('[data-toggle]').forEach(el => {
      el.addEventListener('click', () => toggleTask(selectedDate, el.dataset.toggle));
    });
    taskList.querySelectorAll('[data-del]').forEach(el => {
      el.addEventListener('click', () => deleteTask(selectedDate, el.dataset.del, el.closest('.task-item')));
    });
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function addTask(key, text) {
    text = text.trim();
    if (!text) return;
    if (!data[key]) data[key] = [];
    data[key].push({ id: uid(), text, done: false, createdAt: Date.now() });
    save();
    renderCalendar();
    renderTasks();
  }

  function toggleTask(key, id) {
    const tasks = data[key];
    if (!tasks) return;
    const t = tasks.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); renderTasks(); }
  }

  function deleteTask(key, id, el) {
    el.classList.add('removing');
    setTimeout(() => {
      data[key] = (data[key] || []).filter(t => t.id !== id);
      if (data[key].length === 0) delete data[key];
      save();
      renderCalendar();
      renderTasks();
    }, 200);
  }

  // Add form
  document.getElementById('addBtn').addEventListener('click', () => {
    if (!selectedDate) return;
    addTask(selectedDate, taskInput.value);
    taskInput.value = '';
    taskInput.focus();
  });
  taskInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (!selectedDate) return;
      addTask(selectedDate, taskInput.value);
      taskInput.value = '';
    }
  });

  // Filters
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      renderTasks();
    });
  });

  // ── Init ───────────────────────────────────────────────────────────────────
  initView();
  renderCalendar();
  renderTasks();
</script>
</body>
</html>
